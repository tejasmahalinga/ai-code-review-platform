      package shop;

      public class Shipping {
          private final UserRepository users;

          public Shipping(UserRepository users) {
              this.users = users;
          }

          public String cityFor(long userId) {
              User user = users.findById(userId);
              return user.getAddress().getCity();
          }
      }
