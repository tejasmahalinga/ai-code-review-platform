description: A refactor dropped an await, so the code reads properties of a Promise.
title: Simplify profile loading
files:
  - path: web/profile.ts
    status: modified
    source: |
      import { api } from "./api";

      export async function loadProfile(userId: string) {
        const response = api.get(`/users/${userId}`);
        if (!response.ok) {
          throw new Error("failed");
        }
        return response.json();
      }
    patch: |
      @@ -1,8 +1,8 @@
       import { api } from "./api";
       
       export async function loadProfile(userId: string) {
      -  const response = await api.get(`/users/${userId}`);
      +  const response = api.get(`/users/${userId}`);
         if (!response.ok) {
           throw new Error("failed");
         }
expected:
  - path: web/profile.ts
    lines: [4, 5]
    category: bug
    keywords: [await, promise, async]
