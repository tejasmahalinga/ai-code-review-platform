{{- $fullname := include "reviewbot.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "reviewbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reviewbot.selectorLabels" (list . "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reviewbot.selectorLabels" (list . "web") | nindent 8 }}
      {{- with .Values.web.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "reviewbot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "reviewbot.podScheduling" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "reviewbot.webImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          livenessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /login, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: next-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "reviewbot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "reviewbot.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.webPort }}
      targetPort: http
{{- with (include "reviewbot.hpa" (list . "web" .Values.web)) }}
---
{{ . }}
{{- end }}
{{- with (include "reviewbot.pdb" (list . "web" .Values.web)) }}
---
{{ . }}
{{- end }}
