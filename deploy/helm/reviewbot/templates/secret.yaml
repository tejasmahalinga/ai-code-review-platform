{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "reviewbot.secretName" . }}
  labels:
    {{- include "reviewbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey is required (or set secrets.existingSecret)" .Values.secrets.djangoSecretKey | quote }}
  REVIEWBOT_ENCRYPTION_KEYS: {{ required "secrets.encryptionKeys is required (or set secrets.existingSecret)" .Values.secrets.encryptionKeys | quote }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required (or set secrets.existingSecret)" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required (or set secrets.existingSecret)" .Values.secrets.redisUrl | quote }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
