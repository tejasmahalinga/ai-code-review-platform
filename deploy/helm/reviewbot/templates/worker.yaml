{{- $fullname := include "reviewbot.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-worker
  labels:
    {{- include "reviewbot.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reviewbot.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reviewbot.selectorLabels" (list . "worker") | nindent 8 }}
      annotations:
        {{- include "reviewbot.configChecksums" . | nindent 8 }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "reviewbot.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with (include "reviewbot.podScheduling" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with (include "reviewbot.waitForMigrations" . | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "reviewbot.apiImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- include "reviewbot.backendEnv" . | nindent 10 }}
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A config inspect ping --destination celery@$HOSTNAME --timeout 10 >/dev/null"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- with (include "reviewbot.hpa" (list . "worker" .Values.worker)) }}
---
{{ . }}
{{- end }}
{{- with (include "reviewbot.pdb" (list . "worker" .Values.worker)) }}
---
{{ . }}
{{- end }}
