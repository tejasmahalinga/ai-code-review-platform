name: Release

# Runs when a v*.*.* tag is pushed, or manually from the Actions tab ("Run workflow" with a version), in which
# case it creates the tag on the selected commit first.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3, got '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"; exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Reviewbot $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  images:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/reviewbot-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SBOM and SLSA provenance attestation to the image index.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  scan:
    runs-on: ubuntu-latest
    needs: [prepare, images]
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan the published images (report only)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in api web; do
            image="ghcr.io/$owner/reviewbot-$name:$VERSION"
            docker pull --quiet "$image"
            echo "### Trivy: $image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image \
              --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  chart:
    runs-on: ubuntu-latest
    needs: [prepare, images]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4
      - name: Package and push the Helm chart to GHCR (OCI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package deploy/helm/reviewbot --version "$VERSION" --app-version "$VERSION" --destination dist
          helm push "dist/reviewbot-$VERSION.tgz" "oci://ghcr.io/$owner/charts"

  github-release:
    runs-on: ubuntu-latest
    needs: [prepare, images, chart]
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Release notes are the version's section of CHANGELOG.md ("## [1.2.3] ..."), plus install pointers.
          awk -v heading="## [$VERSION]" 'index($0, "## ") == 1 { p = (index($0, heading) == 1); next } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION; using generated notes"
            gh release create "$TAG" --generate-notes --verify-tag
            exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat >> notes.md <<NOTES

          ### Install
          - Images: \`ghcr.io/$owner/reviewbot-api:$VERSION\`, \`ghcr.io/$owner/reviewbot-web:$VERSION\` (amd64, arm64)
          - Helm: \`helm install reviewbot oci://ghcr.io/$owner/charts/reviewbot --version $VERSION\`
          - Docker Compose: see docs/self-hosting.md
          NOTES
          gh release create "$TAG" --notes-file notes.md --verify-tag --title "Reviewbot $TAG"
