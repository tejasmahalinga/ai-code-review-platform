name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reviewbot
          POSTGRES_PASSWORD: reviewbot
          POSTGRES_DB: reviewbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewbot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://reviewbot:reviewbot@localhost:5432/reviewbot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy apps config
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
      - name: Tests
        run: pytest --cov --cov-report=term-missing:skip-covered
      - name: Evaluation harness smoke test
        # The demo provider is not a model: this checks the cases and the command, not review quality.
        run: python manage.py evaluate_reviews --provider fake
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings
          REVIEWBOT_ENABLE_FAKE_PROVIDER: "true"
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable --progress-spinner off || echo "::warning::pip-audit reported issues"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Lint and validate
        working-directory: deploy/helm/reviewbot
        run: |
          for values in ci/*.yaml; do
            helm lint . --strict -f "$values"
            helm template ci . -f "$values" | kubeconform -strict -summary -kubernetes-version 1.29.0 -
          done

  e2e:
    name: End-to-end (Docker Compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack against a stub GitHub
        run: |
          cp e2e.env .env
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - name: Smoke test
        run: python3 ../scripts/e2e/smoke_test.py
        env:
          BASE_URL: http://localhost:3000
          FAKE_GITHUB_URL: http://localhost:9000
      - name: Scan images for known vulnerabilities (report only)
        run: |
          for image in reviewbot-api:local reviewbot-web:local; do
            echo "### Trivy: $image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 image \
              --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$image" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
